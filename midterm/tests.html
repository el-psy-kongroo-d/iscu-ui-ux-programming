<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>데브플랜 동작 검사</title>
<h1>브라우저 동작 검사</h1><pre id="results" role="status" style="white-space:pre-wrap">실행 중…</pre><iframe title="검사 대상" style="width:390px;height:800px"></iframe>
<script>
const frame = document.querySelector('iframe');
const width = Number(new URLSearchParams(location.search).get('width')) || 390;
frame.style.width = width + 'px';
const passed = [];
frame.onload = () => {
 const d = frame.contentDocument;
 const $ = s => d.querySelector(s);
 const click = s => $(s).click();
 const check = (value, message) => { if (!value) throw Error(message); passed.push('PASS: ' + message); };
 const change = (s, value) => { $(s).value = value; $(s).dispatchEvent(new Event('input', {bubbles:true})); };
 try {
  check($('#plan-empty') && !$('#plan-empty').hidden, '초기 빈 목록 안내');
  click('#startButton'); click('#intro-start');
  check((d.querySelector('.progress__item[aria-current="step"]')?.textContent || '').includes('정보'), '현재 단계 안내');
  click('#title-next'); check($('#title-error').textContent.length > 0, '빈 제목 차단');
  change('#topic-input', '세션과 쿠키'); click('#title-next');
  change('#duration-range', '2'); check($('#duration-range').getAttribute('aria-valuetext') === '60분', '시간 선택의 접근성 안내'); click('#review-option'); click('input[name="review-count"][value="3"]');
  click('#option-prev'); check($('#topic-input').value === '세션과 쿠키', '이전 단계 값 유지');
  click('#title-next'); click('#option-next'); click('#finish-button'); click('#save-plan');
  check(d.querySelectorAll('#plan-list li').length === 1, '계획 추가');
  check($('#save-plan').disabled, '중복 추가 방지');
  const openBox = $('[data-action="open"]').getBoundingClientRect();
  const cancelBox = $('[data-action="cancel"]').getBoundingClientRect();
  check(openBox.top < cancelBox.top || (Math.abs(openBox.top - cancelBox.top) < 1 && openBox.left < cancelBox.left), '모바일 목록에서 다시 열기를 취소보다 먼저 배치');
  click('[data-action="open"]');
  check($('#detail-title').textContent === '세션과 쿠키', '다시 열기 제목 반영');
  check($('#detail-duration').textContent === '60분', '시간 반영');
  check($('#detail-review').textContent === '복습 문제 3개', '복습 반영');
  click('#detail-close');
  click('#startButton'); click('#intro-start');
  check($('#topic-input').value === '', '추가한 뒤 새 계획 시작 시 초기화');
  change('#topic-input', '<img src=x onerror=alert(1)>'); click('#title-next'); click('#option-next'); click('#finish-button'); click('#save-plan');
  check(d.querySelectorAll('#plan-list li').length === 2, '새 계획 추가 시 기존 목록 유지');
  check(!$('#plan-list img'), '학습 주제는 HTML이 아닌 텍스트로 표시');
  const lastCancel = d.querySelectorAll('[data-action="cancel"]')[1]; lastCancel.click(); click('#cancel-confirm');
  click('[data-action="open"]'); check($('#detail-duration').textContent === '60분' && $('#detail-title').textContent === '세션과 쿠키', '기존 계획 스냅샷 유지');
  click('#detail-close'); click('[data-action="cancel"]'); click('#cancel-keep');
  check(d.querySelectorAll('#plan-list li').length === 1, '취소 철회 시 보존');
  click('[data-action="cancel"]'); click('#cancel-confirm');
  check(d.querySelectorAll('#plan-list li').length === 0 && !$('#plan-empty').hidden, '취소 후 빈 목록');
  click('#restart-button'); check($('#topic-input').value === '', '다시 시작 초기화');
  check($('#duration-range').value === '1' && !$('#review-option').checked, '선택 초기화');
  change('#topic-input', '   '); click('#title-next');
  check($('#topic-input').getAttribute('aria-invalid') === 'true', '공백 주제 차단');
  change('#topic-input', '동일한 주제'); click('#title-next');
  check(!$('#topic-input').hasAttribute('aria-invalid'), '입력 수정 후 오류 해제');
  change('#duration-range', '0'); click('#option-next'); click('#finish-button'); click('#save-plan');
  click('[data-action="open"]');
  check($('#detail-duration').textContent === '15분' && $('#detail-review').textContent === '복습 없음', '15분 및 복습 미선택 반영'); click('#detail-close');
  click('#restart-button'); change('#topic-input', '동일한 주제'); click('#title-next'); click('#option-next'); click('#finish-button'); click('#save-plan');
  d.querySelectorAll('[data-action="cancel"]')[0].click(); click('#cancel-confirm');
  check(d.querySelectorAll('#plan-list li').length === 1, '같은 주제라도 선택한 항목만 취소');
  click('[data-action="open"]'); check($('#detail-duration').textContent === '30분', '같은 주제의 다른 계획 유지'); click('#detail-close');
  click('#restart-button'); change('#topic-input', 'A'.repeat(100));
  click('#startButton'); click('#intro-back');
  check($('#topic-input').value.length === 100 && !$('#plan-flow').hidden, '안내에서 돌아가도 작성 중인 값 유지');
  click('#startButton'); click('#intro-start'); click('#title-next'); click('#review-option'); click('input[name="review-count"][value="3"]'); click('#option-next');
  click('#summary-prev'); click('input[name="review-count"][value="1"]'); change('#duration-range', '0'); click('#option-next');
  check($('#summary-duration').textContent === '15분' && $('#summary-review').textContent === '복습 문제 1개', '수정한 시간과 복습 수 재반영');
  check($('#summary-title').textContent === 'A'.repeat(100) && d.documentElement.scrollWidth <= width, '100자 주제와 확인 화면의 긴 문자열 배치');
  click('#finish-button');
  check(d.querySelector('.progress__item[aria-current="step"]').textContent.includes('목록 추가'), '완료 단계 안내');
  click('#save-plan');
  d.querySelectorAll('[data-action="open"]')[1].click();
  check($('#detail-title').textContent === 'A'.repeat(100) && d.documentElement.scrollWidth <= width, '100자 주제 추가 및 다시 열기');
  click('#detail-close');
  click('#tab-practice');
  $('#tab-practice').dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', {key:'ArrowRight',bubbles:true}));
  check($('#tab-audience').getAttribute('aria-selected') === 'true' && d.activeElement === $('#tab-audience'), '키보드 화살표로 탭 전환');
  check(d.documentElement.scrollWidth <= width, width + 'px 가로 넘침 없음');
  document.querySelector('#results').textContent = passed.join('\n') + '\n전체 ' + passed.length + '개 검사 통과';
 } catch (e) { document.querySelector('#results').textContent = passed.join('\n') + '\nFAIL: ' + e.message; }
};
frame.src = 'index.html?test=' + Date.now();
</script></html>
