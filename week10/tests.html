<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>테스트 · 데브플랜 week10</title>
<style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}li{margin:.4rem 0}.pass{color:green}.fail{color:#b00}iframe{width:100%;height:420px;border:1px solid #aaa}</style>
<h1>주차 week10 브라우저 동작 검사</h1><p>같은 출처의 실제 페이지를 iframe으로 열어 동작을 검사합니다. 기존 학습 계획을 임시 보관하고 검사 후 복원합니다.</p><ol id="results"></ol><iframe id="app" title="실제 데브플랜 페이지"></iframe>
<script>
const week='week10', frame=document.querySelector('#app'), results=document.querySelector('#results');
const storageKey='devplan-'+week+'-plans-v1';let savedPlans=null,storageError=null;
try{savedPlans=localStorage.getItem(storageKey);localStorage.removeItem(storageKey)}catch(error){storageError=error}
const restorePlans=()=>{if(storageError)return;try{if(savedPlans===null)localStorage.removeItem(storageKey);else localStorage.setItem(storageKey,savedPlans)}catch(error){const li=document.createElement('li');li.textContent='기존 계획 복원 실패 · '+error.message;li.className='fail';results.append(li)}};
const stopTestFrame=()=>{frame.remove();restorePlans()};
window.addEventListener('beforeunload',stopTestFrame);
const check=(ok,name)=>{const li=document.createElement('li');li.textContent=(ok?'통과 · ':'실패 · ')+name;li.className=ok?'pass':'fail';results.append(li);if(!ok)throw Error(name)};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
frame.addEventListener('load',async()=>{try{
 const d=frame.contentDocument,w=frame.contentWindow;
 const click=sel=>d.querySelector(sel).click();
 const savePlan=async title=>{d.querySelector('#presentation-title').value=title;d.querySelector('#presentation-title').dispatchEvent(new w.Event('input',{bubbles:true}));click('#info-next');d.querySelector('input[name="duration"][value="60"]').checked=true;click('#option-next');const summaryMatches=d.querySelector('#summary-duration').textContent==='60분';click('#save-plan');return {busy:d.querySelector('#plan-form').getAttribute('aria-busy')==='true',summaryMatches}};
 if(week==='week9'){
   const title=d.querySelector('#presentation-title');title.value='';click('#info-next');check(title.getAttribute('aria-invalid')==='true','빈 주제 차단');
   title.value='A';title.dispatchEvent(new w.Event('input',{bubbles:true}));check(title.getAttribute('aria-invalid')==='true','한 글자 주제 차단');
   title.value='JS';title.dispatchEvent(new w.Event('input',{bubbles:true}));check(title.getAttribute('aria-invalid')!=='true','주제 수정 후 오류 해제');
   click('#info-next');check([...d.querySelectorAll('input[name="qna-count"]')].every(x=>x.disabled),'복습 미선택 시 문제 수 비활성화');
 }
 if(week==='week10'||week==='week11'){
   d.querySelector('#menu-toggle').click();check(d.querySelector('#menu-toggle').getAttribute('aria-expanded')==='true','모바일 메뉴 열림 상태');
   d.querySelector('#main-nav a[href="#archive"]').click();await wait(0);check(d.querySelector('#menu-toggle').getAttribute('aria-expanded')==='false','내비게이션 선택 후 메뉴 닫힘');
   check(d.activeElement===d.querySelector('#archive h2'),'메뉴 닫은 뒤 목적지 제목으로 초점 이동');
 }
 click('#restart-button');
 const title=d.querySelector('#presentation-title');title.value='A'.repeat(61);title.dispatchEvent(new w.Event('input',{bubbles:true}));click('#info-next');check(title.getAttribute('aria-invalid')==='true','60자 초과 주제 차단');
 title.value='A'.repeat(60);title.dispatchEvent(new w.Event('input',{bubbles:true}));click('#info-next');check(!d.querySelector('[data-step="2"]').hidden,'60자 주제 허용');
 title.value='작성 중인 주제';title.dispatchEvent(new w.Event('input',{bubbles:true}));d.querySelector('input[name="duration"][value="60"]').checked=true;
 d.querySelector('.hero a[href="#planner"]').click();check(title.value==='작성 중인 주제'&&d.querySelector('input[name="duration"]:checked').value==='60'&&!d.querySelector('[data-step="2"]').hidden,'진행 중인 설정에서 상단 링크로 이동해도 입력 유지');
 click('#option-next');d.querySelector('.hero a[href="#planner"]').click();check(!d.querySelector('[data-step="3"]').hidden&&title.value==='작성 중인 주제','확인 단계에서 상단 링크로 이동해도 입력 유지');
 click('#restart-button');
 const result=await savePlan('배열 메서드 복습');check(result.summaryMatches,'요약과 저장 선택 시간이 일치');check(result.busy,'저장 중 busy 상태 표시');check(d.querySelector('#edit-info').disabled&&d.querySelector('#edit-options').disabled,'저장 중 정보·조건 수정 잠금');
 if(week==='week9'){
   d.querySelector('#plan-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));check(d.querySelector('#plan-count').textContent==='0','저장 중 중복 제출 차단');
 }
 await wait(750);
 check(d.querySelector('#submit-status').classList.contains('is-success'),'저장 성공 상태 표시');check(!d.querySelector('#edit-info').disabled&&!d.querySelector('#edit-options').disabled,'저장 완료 후 수정 버튼 복구');
 d.querySelector('.hero a[href="#planner"]').click();check(d.querySelector('#presentation-title').value===''&&d.querySelector('input[name="duration"]:checked').value==='30'&&!d.querySelector('[data-step="1"]').hidden&&d.querySelectorAll('#plan-list .plan-card').length===1,'완료 후 상단 링크로 새 계획 시작');
 check(JSON.parse(w.localStorage.getItem('devplan-'+week+'-plans-v1'))[0].duration==='60','시간이 저장 데이터에 유지됨');
 if(week==='week9'){
   await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src=origin+'index.html?reload='+Date.now()});
   check(frame.contentDocument.querySelector('#plan-count').textContent==='1','새로고침 후 계획 복원');
 }
 if(week==='week10'||week==='week11'){
   const activeFilter=d.querySelector('[data-filter="active"]');activeFilter.click();
   const cancel=d.querySelector('button[data-action="toggle"]');cancel.focus();cancel.click();
   check(d.activeElement===activeFilter,'저장됨 필터에서 마지막 계획 취소 후 필터로 초점 이동');
   d.querySelector('[data-filter="cancelled"]').click();check(d.querySelector('[data-filter="cancelled"]').getAttribute('aria-pressed')==='true'&&d.querySelectorAll('#plan-list .plan-card').length===1,'취소됨 필터 결과와 선택 상태');
   click('#restart-button');const next=await savePlan('필터 전환 확인');check(next.busy,'취소됨 필터에서 새 계획 저장 시작');await wait(750);
   check(activeFilter.getAttribute('aria-pressed')==='true'&&activeFilter.classList.contains('is-active')&&[...d.querySelectorAll('.plan-title')].some(x=>x.textContent==='필터 전환 확인'),'저장 성공 후 저장됨 필터와 새 계획 표시 동기화');
   const nextId=JSON.parse(w.localStorage.getItem('devplan-'+week+'-plans-v1')).find(x=>x.title==='필터 전환 확인').id;
   const nextCancel=[...d.querySelectorAll('button[data-action="toggle"]')].find(x=>x.dataset.id===nextId);nextCancel.focus();nextCancel.click();
   check(d.activeElement===activeFilter,'저장됨 필터에서 마지막 카드 취소 후 필터로 초점 이동');d.querySelector('[data-filter="all"]').click();
 }
 if(week==='week11'){
   const d2=frame.contentDocument,w2=frame.contentWindow;
   check(!d2.querySelector('img[src*="service.png"]'),'발표 콘셉트 이미지 제거');
   d2.querySelector('button[data-action="open"]').click();
   check(d2.querySelector('#plan-dialog').open,'계획 상세 대화상자 열림');
   d2.querySelector('#dialog-close').click();check(!d2.querySelector('#plan-dialog').open,'명시적 닫기 버튼 동작');
   w2.location.hash='#archive';await wait(0);check(w2.document.title.includes('내 계획'),'현재 위치에 따라 문서 제목 변경');
 }
}catch(error){const li=document.createElement('li');li.textContent='검사 중단 · '+error.message;li.className='fail';results.append(li)}finally{stopTestFrame()}},{once:true});
const origin=location.href.slice(0,location.href.lastIndexOf('/')+1);
if(storageError){const li=document.createElement('li');li.textContent='검사 중단 · 브라우저 저장소에 접근할 수 없습니다.';li.className='fail';results.append(li)}else frame.src=origin+'index.html?test='+Date.now();
</script></html>
